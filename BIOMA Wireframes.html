<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel" src="design-canvas.jsx"></script>

<body>
<script type="text/babel">

// ─── Wireframe Primitives ───────────────────────────────────

const PINK = '#e8a0b8';
const PINK_LIGHT = '#faeef3';
const PINK_MID = '#d4729a';
const INK = '#1a1a1a';
const GRAY = '#888';
const GRAY_LIGHT = '#e8e6e3';
const GRAY_MID = '#ccc';
const GREEN = '#6dbf8a';
const YELLOW = '#f0c050';
const RED = '#e06060';

// Sketchy box
const Box = ({ w, h, style, children, fill = '#fff', border = INK }) => (
  <div style={{
    width: w, height: h, background: fill,
    border: `2px solid ${border}`,
    borderRadius: '3px 5px 4px 3px',
    position: 'relative',
    ...style
  }}>{children}</div>
);

// Placeholder image block
const ImgPlaceholder = ({ w, h, label, style }) => (
  <div style={{
    width: w, height: h, background: GRAY_LIGHT,
    border: `2px dashed ${GRAY_MID}`,
    display: 'flex', flexDirection: 'column',
    alignItems: 'center', justifyContent: 'center',
    color: GRAY, fontSize: 13, ...style
  }}>
    <svg width="28" height="28" viewBox="0 0 28 28" fill="none" style={{marginBottom:4}}>
      <rect x="2" y="6" width="24" height="18" rx="2" stroke={GRAY} strokeWidth="1.5"/>
      <circle cx="10" cy="12" r="2.5" stroke={GRAY} strokeWidth="1.5"/>
      <path d="M2 20l7-6 5 4 4-3 8 7" stroke={GRAY} strokeWidth="1.5" fill="none"/>
    </svg>
    {label}
  </div>
);

// Pill / tag
const Pill = ({ label, color = PINK, textColor = '#fff', style }) => (
  <span style={{
    background: color, color: textColor,
    padding: '2px 10px', borderRadius: 20,
    fontSize: 13, fontWeight: 600,
    display: 'inline-block', ...style
  }}>{label}</span>
);

// Sketchy button
const Btn = ({ label, fill = INK, textColor = '#fff', w, style }) => (
  <div style={{
    width: w || '100%', background: fill, color: textColor,
    border: `2px solid ${INK}`,
    borderRadius: '6px 7px 5px 6px',
    padding: '10px 0', textAlign: 'center',
    fontSize: 16, fontWeight: 600,
    cursor: 'pointer', ...style
  }}>{label}</div>
);

// Sketchy input
const Input = ({ label, value, style }) => (
  <div style={{ width: '100%', ...style }}>
    <div style={{ fontSize: 12, color: GRAY, marginBottom: 2 }}>{label}</div>
    <div style={{
      border: `2px solid ${INK}`,
      borderRadius: '4px 5px 4px 3px',
      padding: '8px 12px', fontSize: 15,
      color: value ? INK : GRAY_MID,
      background: '#fafafa'
    }}>{value || '—'}</div>
  </div>
);

// Status bar
const StatusBar = () => (
  <div style={{ background: PINK_MID, height: 36, display: 'flex', alignItems: 'center',
    justifyContent: 'space-between', padding: '0 16px', color: '#fff', fontSize: 13, fontWeight: 600 }}>
    <span>9:41</span>
    <span>BIOMA</span>
    <span>📶 🔋</span>
  </div>
);

// Bottom nav
const BottomNav = ({ active = 0 }) => {
  const items = ['Início','Triagem','Histórico','Perfil'];
  const icons = ['🏠','🔬','📋','👤'];
  return (
    <div style={{ height: 56, borderTop: `2px solid ${GRAY_MID}`, display: 'flex',
      background: '#fff', position: 'absolute', bottom: 0, left: 0, right: 0 }}>
      {items.map((item, i) => (
        <div key={i} style={{ flex: 1, display: 'flex', flexDirection: 'column',
          alignItems: 'center', justifyContent: 'center',
          color: i === active ? PINK_MID : GRAY, fontSize: 12, gap: 2 }}>
          <span style={{ fontSize: 18 }}>{icons[i]}</span>
          <span>{item}</span>
        </div>
      ))}
    </div>
  );
};

// Section header inside a screen
const ScreenTitle = ({ label, sub, style }) => (
  <div style={{ padding: '12px 16px 6px', ...style }}>
    <div style={{ fontSize: 22, fontWeight: 700, color: INK }}>{label}</div>
    {sub && <div style={{ fontSize: 14, color: GRAY }}>{sub}</div>}
  </div>
);

// Risk gauge (half-circle SVG)
const RiskGauge = ({ level = 'normal', size = 120 }) => {
  const color = level === 'normal' ? GREEN : level === 'atencao' ? YELLOW : RED;
  const label = level === 'normal' ? 'Normal' : level === 'atencao' ? 'Atenção' : 'Alto Risco';
  const angle = level === 'normal' ? 30 : level === 'atencao' ? 105 : 165;
  const r = 46, cx = 60, cy = 60;
  const toRad = (a) => (a - 180) * Math.PI / 180;
  const px = cx + r * Math.cos(toRad(angle));
  const py = cy + r * Math.sin(toRad(angle));
  return (
    <div style={{ display: 'flex', flexDirection: 'column', alignItems: 'center' }}>
      <svg width={size} height={size * 0.6} viewBox="0 0 120 72">
        {/* track */}
        <path d={`M14,60 A46,46 0 0,1 106,60`} fill="none" stroke={GRAY_LIGHT} strokeWidth="10" strokeLinecap="round"/>
        {/* green zone */}
        <path d={`M14,60 A46,46 0 0,1 47,18`} fill="none" stroke={GREEN} strokeWidth="10" strokeLinecap="round" opacity="0.9"/>
        {/* yellow zone */}
        <path d={`M47,18 A46,46 0 0,1 82,18`} fill="none" stroke={YELLOW} strokeWidth="10" strokeLinecap="round" opacity="0.9"/>
        {/* red zone */}
        <path d={`M82,18 A46,46 0 0,1 106,60`} fill="none" stroke={RED} strokeWidth="10" strokeLinecap="round" opacity="0.9"/>
        {/* needle */}
        <line x1={cx} y1={cy} x2={px} y2={py} stroke={INK} strokeWidth="3" strokeLinecap="round"/>
        <circle cx={cx} cy={cy} r="5" fill={INK}/>
      </svg>
      <div style={{ fontSize: 18, fontWeight: 700, color, marginTop: -4 }}>{label}</div>
    </div>
  );
};

// Divider
const Divider = () => <div style={{ height: 1, background: GRAY_LIGHT, margin: '8px 0' }}/>;

// Card block
const Card = ({ children, style }) => (
  <div style={{
    background: '#fff', border: `1.5px solid ${GRAY_MID}`,
    borderRadius: '6px 8px 7px 6px', padding: '12px 14px',
    ...style
  }}>{children}</div>
);

// ─── SCREEN COMPONENTS ─────────────────────────────────────
